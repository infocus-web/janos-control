<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0a18">
<title>Mis eventos · Janos Control</title>
<style>
  :root { --gold:#c9a84c; --gold-2:#e8c97a; --gold-soft:rgba(201,168,76,.12); --gold-border:rgba(201,168,76,.28); --bg:#0f0a18; --panel:#1a1226; --panel-2:#221833; --line:rgba(255,255,255,.08); --ink:#f3eefb; --muted:#a99cbf; --ok:#3ecf8e; --warn:#f0b44c; --danger:#ef6b6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; font-size:16px; -webkit-text-size-adjust:100%; }
  button,input,textarea { font:inherit; color:inherit; }
  a { color:var(--gold-2); }
  .wrap { max-width:760px; margin:0 auto; padding:16px 16px 60px; }
  .muted { color:var(--muted); }
  .eyebrow { margin:0; color:var(--gold); font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
  .btn { border:1px solid var(--line); background:var(--panel-2); border-radius:10px; padding:10px 14px; cursor:pointer; min-height:44px; }
  .btn:hover { border-color:var(--gold-border); }
  .btn-primary { background:linear-gradient(135deg,var(--gold),#a87830); color:#1a1000; border:0; font-weight:700; }
  .btn:disabled { opacity:.55; cursor:default; }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  /* login */
  .login { min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at top,#1e1030,var(--bg) 65%); }
  .login form { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px; display:grid; gap:14px; }
  .login h1 { margin:4px 0 0; font-size:24px; }
  label { display:grid; gap:6px; font-size:14px; color:var(--muted); }
  input, textarea { width:100%; background:#140e1f; border:1px solid var(--line); border-radius:10px; padding:12px; color:var(--ink); }
  textarea { resize:vertical; min-height:70px; }
  .msg { margin:0; padding:10px 12px; border-radius:10px; font-size:14px; background:rgba(239,107,107,.12); color:#ffb3b3; border:1px solid rgba(239,107,107,.3); }
  .msg:empty { display:none; }
  /* app */
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0 16px; border-bottom:1px solid var(--line); }
  .top h1 { margin:2px 0 0; font-size:22px; }
  .top p { margin:4px 0 0; font-size:14px; }
  .tabs { display:flex; gap:8px; margin:16px 0 8px; flex-wrap:wrap; }
  .tab { border:1px solid var(--line); background:transparent; border-radius:999px; padding:8px 14px; cursor:pointer; min-height:40px; color:var(--muted); }
  .tab.active { color:var(--gold); background:var(--gold-soft); border-color:var(--gold-border); }
  .tab b { margin-left:4px; }
  .toggle { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted); margin:4px 0 12px; }
  .toggle input { width:18px; height:18px; }
  .month { margin:22px 0 8px; font-size:13px; color:var(--muted); text-transform:capitalize; letter-spacing:.04em; }
  .event { background:var(--panel); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; }
  .event.mine { border-color:var(--gold-border); }
  .event summary { list-style:none; cursor:pointer; padding:14px; display:grid; grid-template-columns:56px 1fr auto; gap:12px; align-items:center; }
  .event summary::-webkit-details-marker { display:none; }
  .date { text-align:center; background:var(--panel-2); border-radius:10px; padding:6px 0; }
  .date strong { display:block; font-size:20px; line-height:1.1; }
  .date span { font-size:11px; color:var(--muted); text-transform:uppercase; }
  .ev-title { margin:0; font-size:16px; font-weight:700; }
  .ev-sub { margin:3px 0 0; font-size:13px; color:var(--muted); }
  .badge { display:inline-block; font-size:11px; padding:3px 8px; border-radius:999px; background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold-border); white-space:nowrap; }
  .badge.soft { background:transparent; color:var(--muted); border-color:var(--line); }
  .body { padding:0 14px 16px; display:grid; gap:16px; }
  .cover { background:var(--gold-soft); border:1px solid var(--gold-border); border-radius:12px; padding:12px; font-size:14px; display:grid; gap:4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px 16px; margin:0; }
  .grid dt { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .grid dd { margin:2px 0 0; font-size:14px; word-break:break-word; }
  .links { display:flex; gap:8px; flex-wrap:wrap; }
  .links a { text-decoration:none; }
  h3 { margin:0 0 8px; font-size:14px; color:var(--gold); }
  .phase { font-size:12px; color:var(--muted); margin:10px 0 4px; }
  .task { display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:14px; }
  .task:first-of-type { border-top:0; }
  .task input { width:22px; height:22px; margin:0; flex:none; accent-color:var(--gold); }
  .task small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .task.done span { color:var(--muted); text-decoration:line-through; }
  .note { background:var(--panel-2); border-radius:10px; padding:10px 12px; font-size:14px; white-space:pre-wrap; display:grid; gap:6px; }
  .note small { color:var(--muted); font-size:12px; display:flex; justify-content:space-between; gap:8px; }
  .note button { background:none; border:0; color:var(--muted); cursor:pointer; padding:0; text-decoration:underline; }
  .note-form { display:grid; gap:8px; margin-top:8px; }
  .notices { margin:16px 0 0; background:linear-gradient(135deg,rgba(201,168,76,.18),rgba(201,168,76,.06)); border:1px solid var(--gold-border); border-radius:14px; padding:14px; display:grid; gap:10px; }
  .notices h2 { margin:0; font-size:15px; color:var(--gold-2); }
  .notices ul { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  .notices li { font-size:14px; line-height:1.4; display:grid; grid-template-columns:22px 1fr; gap:6px; }
  .notices li small { grid-column:2; color:var(--muted); font-size:12px; }
  .pay { display:grid; gap:10px; margin-top:8px; }
  .pay h3 { margin:14px 0 0; }
  .pay h3 small { color:var(--muted); font-weight:400; }
  .pay-hero { background:linear-gradient(135deg,rgba(201,168,76,.2),rgba(201,168,76,.05)); border:1px solid var(--gold-border); border-radius:16px; padding:16px; display:grid; gap:6px; }
  .pay-hero > span { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.06em; }
  .pay-hero > strong { font-size:34px; color:var(--gold-2); }
  .pay-hero small { color:var(--muted); font-size:13px; }
  .pay-calc { list-style:none; margin:4px 0 0; padding:0; display:grid; gap:4px; font-size:14px; }
  .pay-calc li, .pay-row { display:flex; justify-content:space-between; gap:12px; align-items:center; }
  .pay-list { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
  .pay-row { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .pay-row div { display:grid; gap:2px; min-width:0; }
  .pay-row span { color:var(--muted); font-size:13px; }
  .pay-row b { white-space:nowrap; }
  .pay-row b.ok { color:var(--ok); }
  .pay-empty { margin:0; font-size:14px; }
  .pay-sum { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .pay-sum > div { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; display:grid; gap:2px; }
  .pay-sum span { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .pay-sum strong { font-size:20px; }
  .pay-sum small { color:var(--muted); font-size:12px; }
  .cal { margin-top:8px; }
  .cal-head { display:grid; grid-template-columns:44px 1fr 44px; align-items:center; gap:8px; text-align:center; margin-bottom:10px; }
  .cal-head strong { display:block; font-size:18px; }
  .cal-head small { color:var(--muted); font-size:12px; }
  .cal-head .btn { padding:0; font-size:22px; }
  .cal-week, .cal-grid { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:4px; }
  .cal-week span { text-align:center; font-size:11px; color:var(--muted); text-transform:uppercase; padding:4px 0; }
  .cal-cell { aspect-ratio:1 / 1; min-height:44px; min-width:0; border-radius:10px; border:1px solid transparent; background:var(--panel); color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; font-size:15px; padding:0; }
  .cal-cell.blank { background:transparent; cursor:default; }
  .cal-cell.has { background:var(--panel-2); font-weight:700; }
  .cal-cell.today { border-color:var(--gold-border); color:var(--gold-2); }
  .cal-cell.sel { border-color:var(--gold); background:var(--gold-soft); }
  .cal-cell:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .dots { display:flex; gap:3px; min-height:7px; font-size:10px; color:var(--muted); align-items:center; }
  .dot { width:7px; height:7px; border-radius:50%; display:inline-block; background:var(--gold); }
  .dot.s { background:#60a5fa; }
  .cal-legend { display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin:10px 2px 0; font-size:12px; color:var(--muted); }
  .cal-legend span { display:inline-flex; align-items:center; gap:6px; }
  .linkbtn { margin-left:auto; background:none; border:0; color:var(--gold-2); text-decoration:underline; cursor:pointer; font-size:13px; padding:6px 0; min-height:32px; }
  .cal-cell.blocked { background:rgba(239,107,107,.14); border-color:rgba(239,107,107,.35); color:#ffb3b3; }
  .avail { display:grid; gap:10px; margin:0 0 12px; padding:12px; border:1px dashed var(--line); border-radius:12px; }
  .avail .row { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
  .avail p { margin:0; font-size:14px; }
  .avail .warn { color:var(--warn); }
  .blocked-box { border-style:solid; border-color:rgba(239,107,107,.4); background:rgba(239,107,107,.08); }
  .avail a { text-decoration:none; text-align:center; }
  .avail-ok { display:grid; gap:8px; font-size:14px; color:var(--ok); }
  .cal-item b.repl { color:var(--warn); font-size:12px; }
  .cal-item { width:100%; text-align:left; display:grid; gap:3px; background:var(--panel); border:1px solid var(--gold-border); border-left:4px solid var(--gold); border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer; }
  .cal-item.s { border-left-color:#60a5fa; }
  .cal-item span { color:var(--muted); font-size:13px; }
  .cal-item em { color:var(--gold-2); font-style:normal; font-size:13px; }
  .empty { text-align:center; padding:40px 16px; color:var(--muted); background:var(--panel); border:1px dashed var(--line); border-radius:14px; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#2a1f3d; border:1px solid var(--gold-border); padding:12px 16px; border-radius:12px; font-size:14px; z-index:10; max-width:90vw; }
  .toast[hidden] { display:none; }
  @media (max-width:420px) { .event summary { grid-template-columns:50px 1fr; } .event summary .badge { grid-column:2; justify-self:start; } }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
(() => {
  const API = "/api/colleague-portal";
  const KEY = "janos_colega_session";
  const ADDONS = { pant:"Pantalla", miniflex:"Mini Flex", flex:"Flex", sansSouci:"Sans Souci", libro:"Libro Combo", maqui:"Maquillaje", maquiplus:"Maquillaje Plus", maquix2plus:"Maquillaje x2 Plus", moda:"Producción de Moda", drone:"Drone", vipExtras:"Extras VIP", glamCam:"Glam Cam", alfombraRoja:"Alfombra Roja", invitacion:"Invitación Interactiva", fotoIman:"Foto Imán", vipUpgrade:"Upgrade VIP", cere:"Ceremonia" };
  const PACKS = { silver:"Silver", gold:"Golden / All Inclusive", vip:"VIP", informal:"Informal" };
  const root = document.getElementById("root");
  let session = null, state = null, tab = "mine", showPast = false, openIds = new Set(), loginError = "";
  let calMonth = todayIso().slice(0, 7), calDay = ""; // calendario propio (pestaña "Calendario")
  let blockForm = "", lastBlock = null; // "No puedo este día": día con el formulario abierto / último bloqueo con trabajos

  const esc = (v) => String(v ?? "").replace(/[&<>'"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;" }[c]));
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; } }
  function save(s) { session = s; try { s ? localStorage.setItem(KEY, JSON.stringify(s)) : localStorage.removeItem(KEY); } catch {} }
  function todayIso() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
  function dt(iso) { return new Date(`${iso}T12:00:00`); }
  function fmt(iso, opts) { return new Intl.DateTimeFormat("es-AR", opts).format(dt(iso)); }
  function waLink(phone) { let d = String(phone || "").replace(/\D/g, ""); if (!d) return ""; if (!d.startsWith("54")) d = "549" + d.replace(/^0/, "").replace(/^15/, ""); return `https://wa.me/${d}`; }
  let toastTimer;
  function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3500); }

  async function call(action, payload = {}, retry = true) {
    const headers = { "Content-Type": "application/json" };
    if (session?.access_token) headers.Authorization = `Bearer ${session.access_token}`;
    const res = await fetch(API, { method: "POST", headers, body: JSON.stringify({ action, ...payload }) });
    const out = await res.json().catch(() => ({}));
    if (res.status === 401 && retry && session?.refresh_token && action !== "login") {
      const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "refresh", refresh_token: session.refresh_token }) });
      const ro = await r.json().catch(() => ({}));
      if (r.ok && ro.session) { save(ro.session); return call(action, payload, false); }
      save(null); renderLogin("Tu sesión venció. Volvé a entrar."); throw new Error("session");
    }
    if (res.status === 403 && action !== "login") { save(null); renderLogin(out.error); throw new Error("session"); }
    if (!res.ok) throw new Error(out.error || "Algo falló. Probá de nuevo.");
    return out;
  }

  function renderLogin(msg = "") {
    loginError = msg; state = null;
    root.innerHTML = `<div class="login"><form id="loginForm" novalidate>
      <div><p class="eyebrow">Janos Control · Colegas</p><h1>Mis eventos</h1></div>
      <p class="muted" style="margin:0;font-size:14px">Entrá con tu Gmail y la contraseña que te pasó Pablo.</p>
      <p class="msg" id="loginMsg" role="alert">${esc(loginError)}</p>
      <label>Gmail<input name="email" type="email" autocomplete="username" inputmode="email" required></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form></div>`;
  }

  async function refresh() {
    try { state = await call("data"); renderApp(); }
    catch (e) { if (e.message !== "session") { root.innerHTML = `<div class="wrap"><div class="empty">${esc(e.message)}<br><br><button class="btn" data-act="reload">Reintentar</button></div></div>`; } }
  }

  // "Mis coberturas": un ítem por cada cosa que cubre (evento o sesión de
  // fotos, cada una con su fecha). "Mi salón": un ítem por evento.
  function itemsFor(which) {
    const today = todayIso();
    const items = which === "mine"
      ? state.clients.flatMap((c) => c.coverages.map((cov) => ({ c, covs: [cov], date: cov.date, key: `${c.id}:${cov.kind}`, session: cov.kind === "session" })))
      : state.clients.map((c) => ({ c, covs: c.coverages, date: c.event_date, key: `${c.id}:all`, session: false }));
    return items
      .filter((it) => (showPast ? it.date < today : it.date >= today))
      .sort((a, b) => (showPast ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date)) || String(a.covs[0]?.arrival || "").localeCompare(String(b.covs[0]?.arrival || "")));
  }

  function renderApp() {
    const me = state.me, today = todayIso();
    const mineCount = state.clients.flatMap((c) => c.coverages).filter((cv) => cv.date >= today).length;
    const salonCount = state.clients.filter((c) => c.event_date >= today).length;
    const list = tab === "cal" || tab === "pay" ? [] : itemsFor(tab);
    let lastMonth = "";
    const cards = list.map((it) => {
      const m = it.date.slice(0, 7);
      const head = m !== lastMonth ? `<h2 class="month">${esc(fmt(it.date, { month: "long", year: "numeric" }))}</h2>` : "";
      lastMonth = m;
      return head + eventHtml(it);
    }).join("");
    const salons = me.salons.length ? me.salons.join(", ") : "sin salón asignado";
    root.innerHTML = `<div class="wrap">
      <header class="top"><div><p class="eyebrow">Janos Control</p><h1>Hola, ${esc(String(me.name).split(" ")[0])}</h1><p class="muted">${esc(me.role || "Colega")} · ${esc(salons)}</p></div>
        <button class="btn" data-act="logout">Salir</button></header>
      ${noticesHtml()}
      <nav class="tabs" aria-label="Qué eventos ver">
        <button class="tab ${tab === "mine" ? "active" : ""}" data-tab="mine" aria-pressed="${tab === "mine"}">Mis coberturas <b>${mineCount}</b></button>
        <button class="tab ${tab === "all" ? "active" : ""}" data-tab="all" aria-pressed="${tab === "all"}">Todos los de mi salón <b>${salonCount}</b></button>
        <button class="tab ${tab === "cal" ? "active" : ""}" data-tab="cal" aria-pressed="${tab === "cal"}">📅 Calendario</button>
        <button class="tab ${tab === "pay" ? "active" : ""}" data-tab="pay" aria-pressed="${tab === "pay"}">💰 Mis cobros</button>
      </nav>
      ${tab === "pay" ? payHtml() : tab === "cal" ? calendarHtml() : `<label class="toggle"><input type="checkbox" data-act="past" ${showPast ? "checked" : ""}> Ver eventos ya realizados (últimos 60 días)</label>
      ${list.length ? cards : `<div class="empty">${tab === "mine" ? (showPast ? "No cubriste eventos en los últimos 60 días." : "Todavía no tenés coberturas asignadas.") : (me.salons.length ? "No hay eventos en tu salón." : "Todavía no tenés un salón asignado.")}</div>`}`}
    </div>`;
  }

  // ── Mis cobros: lo que le corresponde cobrar y por qué trabajo ──
  const money = (v) => new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 }).format(Number(v) || 0);
  function payHtml() {
    const p = state.pay;
    if (!p) return `<div class="empty">No se pudo cargar tu información de cobros.</div>`;
    const short = (iso) => fmt(iso, { day: "numeric", month: "short" });
    const jobName = (j) => `${j.kind === "session" ? "Sesión de fotos · " : ""}${j.honoree || "Evento"}`;
    const done = p.pending.filter((j) => j.done), next = p.pending.filter((j) => !j.done);
    const row = (j) => `<li class="pay-row"><div><strong>${esc(jobName(j))}</strong><span>${esc(short(j.date))}${j.type ? ` · ${esc(j.type)}` : ""}${j.salon ? ` · ${esc(j.salon)}` : ""}</span></div><b>${money(j.amount)}</b></li>`;
    return `<section class="pay">
      <div class="pay-hero">
        <span>Hoy te corresponde cobrar</span>
        <strong>${money(p.now)}</strong>
        <ul class="pay-calc">
          <li><span>Trabajos realizados sin cobrar</span><b>${money(p.gross)}</b></li>
          ${p.cuotaNow ? `<li><span>Cuota de descuento</span><b>− ${money(p.cuotaNow)}</b></li>` : ""}
          ${p.creditUsed ? `<li><span>Ya cobrado a cuenta</span><b>− ${money(p.creditUsed)}</b></li>` : ""}
        </ul>
        ${p.credit > p.creditUsed ? `<small>Tenés ${money(p.credit - p.creditUsed)} cobrados a cuenta que se descuentan de los próximos trabajos.</small>` : ""}
      </div>
      <div class="pay-sum">
        <div><span>Ya cobraste</span><strong>${money(p.paidTotal)}</strong><small>${p.paidJobs} ${p.paidJobs === 1 ? "trabajo pagado" : "trabajos pagados"}</small></div>
        <div><span>Te descontaron</span><strong>${money(p.discountedTotal)}</strong><small>${p.discountedBy.length ? "ver detalle abajo" : "sin descuentos"}</small></div>
      </div>
      ${p.discountedBy.length ? `<h3>Descontado por concepto</h3><ul class="pay-list">${p.discountedBy.map((d) => `<li class="pay-row"><div><strong>${esc(d.description)}</strong><span>${d.remaining > 0 ? `Total ${money(d.total)} · resta ${money(d.remaining)}` : `Total ${money(d.total)} · saldado ✔`}</span></div><b>− ${money(d.applied)}</b></li>`).join("")}</ul>` : ""}
      <h3>Trabajos realizados sin cobrar</h3>
      ${done.length ? `<ul class="pay-list">${done.map(row).join("")}</ul>` : `<p class="muted pay-empty">No tenés trabajos realizados pendientes de cobro.</p>`}
      <h3>Próximos trabajos <small>· ${money(p.future)}</small></h3>
      ${next.length ? `<ul class="pay-list">${next.map(row).join("")}</ul>` : `<p class="muted pay-empty">No tenés trabajos próximos asignados.</p>`}
      ${p.discounts.length ? `<h3>Descuentos pendientes</h3><ul class="pay-list">${p.discounts.map((d) => `<li class="pay-row"><div><strong>${esc(d.description)}</strong><span>Total ${money(d.total)} · cuota ${d.paidCuotas}/${d.installments} · resta ${money(d.remaining)}</span></div><b>− ${money(d.nextCuota)}</b></li>`).join("")}</ul><p class="muted pay-empty">El monto de la derecha es la cuota que se descuenta en el próximo pago.</p>` : ""}
      <h3>Cobros recibidos <small>(últimos 6 meses)</small></h3>
      ${p.payments.length ? `<ul class="pay-list">${p.payments.map((x) => `<li class="pay-row"><div><strong>${x.kind === "advance" ? "💵 Pago a cuenta" : `Pago de ${x.jobs.length} ${x.jobs.length === 1 ? "trabajo" : "trabajos"}`}</strong><span>${esc(short(x.date))}${x.kind !== "advance" && x.jobs.length ? ` · ${esc(x.jobs.map((j) => jobName(j)).join(", "))}` : ""}${x.discounts ? ` · descuento − ${money(x.discounts)}` : ""}${x.advanceUsed ? ` · a cuenta − ${money(x.advanceUsed)}` : ""}${x.notes ? ` · ${esc(x.notes)}` : ""}</span></div><b class="ok">${money(x.net)}</b></li>`).join("")}</ul>` : `<p class="muted pay-empty">Todavía no hay cobros registrados.</p>`}
    </section>`;
  }

  // ── Calendario propio: solo lo que tiene asignado (eventos y sesiones) ──
  function myItems() {
    return state.clients.flatMap((c) => c.coverages.map((cov) => ({ c, cov, date: cov.date, key: `${c.id}:${cov.kind}` })));
  }
  function calendarHtml() {
    const items = myItems();
    const byDay = new Map();
    items.forEach((it) => { if (!byDay.has(it.date)) byDay.set(it.date, []); byDay.get(it.date).push(it); });
    const [y, m] = calMonth.split("-").map(Number);
    const first = new Date(y, m - 1, 1), days = new Date(y, m, 0).getDate();
    const lead = (first.getDay() + 6) % 7; // semana empieza el lunes
    const today = todayIso();
    const blocked = new Map((state.blocked || []).map((b) => [b.day, b]));
    if (!calDay || !calDay.startsWith(calMonth)) {
      const inMonth = [...byDay.keys()].filter((d) => d.startsWith(calMonth)).sort();
      calDay = today.startsWith(calMonth) ? today : inMonth[0] || `${calMonth}-01`;
    }
    const cells = [];
    for (let i = 0; i < lead; i++) cells.push(`<div class="cal-cell blank" aria-hidden="true"></div>`);
    for (let d = 1; d <= days; d++) {
      const iso = `${calMonth}-${String(d).padStart(2, "0")}`;
      const its = byDay.get(iso) || [];
      const dots = its.slice(0, 3).map((it) => `<i class="dot ${it.cov.kind === "session" ? "s" : "e"}"></i>`).join("");
      const off = blocked.has(iso);
      cells.push(`<button class="cal-cell ${iso === today ? "today" : ""} ${iso === calDay ? "sel" : ""} ${its.length ? "has" : ""} ${off ? "blocked" : ""}" data-day="${iso}" aria-label="${esc(fmt(iso, { weekday: "long", day: "numeric", month: "long" }))}${its.length ? `: ${its.length} ${its.length === 1 ? "trabajo" : "trabajos"}` : ""}${off ? ", no podés" : ""}"><span>${d}</span><span class="dots">${off ? "🚫" : dots}${!off && its.length > 3 ? "+" : ""}</span></button>`);
    }
    const sel = (byDay.get(calDay) || []).sort((a, b) => String(a.cov.arrival || "").localeCompare(String(b.cov.arrival || "")));
    const monthCount = items.filter((it) => it.date.startsWith(calMonth)).length;
    const title = new Intl.DateTimeFormat("es-AR", { month: "long", year: "numeric" }).format(first);
    return `<section class="cal" aria-label="Mi calendario">
      <div class="cal-head">
        <button class="btn" data-cal="prev" aria-label="Mes anterior">‹</button>
        <div><strong>${esc(title.charAt(0).toUpperCase() + title.slice(1))}</strong><small>${monthCount ? `${monthCount} ${monthCount === 1 ? "trabajo" : "trabajos"}` : "Sin trabajos"}</small></div>
        <button class="btn" data-cal="next" aria-label="Mes siguiente">›</button>
      </div>
      <div class="cal-week" aria-hidden="true"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div>
      <div class="cal-grid">${cells.join("")}</div>
      <div class="cal-legend"><span><i class="dot e"></i> Evento</span><span><i class="dot s"></i> Sesión de fotos</span><span>🚫 No podés</span>${calMonth !== today.slice(0, 7) ? `<button class="linkbtn" data-cal="today">Volver a hoy</button>` : ""}</div>
      <h2 class="month">${esc(fmt(calDay, { weekday: "long", day: "numeric", month: "long" }))}</h2>
      ${dayAvailabilityHtml(calDay, sel, blocked.get(calDay))}
      ${sel.length ? sel.map((it) => `<button class="cal-item ${it.cov.kind === "session" ? "s" : ""}" data-open="${esc(it.key)}" data-date="${esc(it.date)}">
          ${blocked.has(it.date) ? `<b class="repl">⚠ Pediste reemplazo</b>` : ""}<strong>${it.cov.arrival ? `${esc(it.cov.arrival)} h · ` : ""}${it.cov.kind === "session" ? "📷 Sesión · " : ""}${esc(it.c.honoree || "Evento")}</strong>
          <span>${esc([it.c.event_type, it.cov.location || it.c.salon, it.cov.role].filter(Boolean).join(" · "))}</span>
          <em>Ver detalle ›</em></button>`).join("") : `<div class="empty">No tenés trabajos este día.</div>`}
    </section>`;
  }

  // "No puedo este día": bloquea la fecha y, si tenía trabajos, le pide reemplazo a Pablo.
  function dayAvailabilityHtml(day, jobs, blockedDay) {
    if (day < todayIso()) return "";
    const boss = (state.boss && state.boss.name) || "Pablo";
    let wa = "";
    if (lastBlock && lastBlock.day === day && lastBlock.affected.length) {
      const bossWa = waLink((state.boss && state.boss.whatsapp) || "");
      const text = `Hola! Soy ${state.me.name}. No puedo cubrir el ${fmt(day, { weekday: "long", day: "numeric", month: "long" })}: ${lastBlock.affected.map((a) => `${a.kind === "session" ? "sesión de fotos de " : ""}${a.honoree}${a.salon ? ` (${a.salon})` : ""}`).join(", ")}.${lastBlock.reason ? ` Motivo: ${lastBlock.reason}.` : ""} Ya lo marqué en el portal.`;
      wa = `<div class="avail-ok">✅ Listo: le pedimos reemplazo a ${esc(boss)} en Janos Control.${bossWa ? `<a class="btn btn-primary" href="${esc(bossWa)}?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">💬 Avisarle también por WhatsApp</a>` : ""}</div>`;
    }
    if (blockedDay) {
      return `<div class="avail blocked-box"><p>🚫 Marcaste que <b>no podés</b> este día${blockedDay.reason ? ` · ${esc(blockedDay.reason)}` : ""}.</p>${wa}<button class="btn" data-act="unblock" data-d="${esc(day)}">Liberar este día</button></div>`;
    }
    if (blockForm === day) {
      return `<form class="avail" data-block="${esc(day)}">
        ${jobs.length ? `<p class="warn">⚠ Tenés ${jobs.length} ${jobs.length === 1 ? "trabajo" : "trabajos"} este día: se le va a pedir <b>reemplazo</b> a ${esc(boss)}.</p>` : `<p class="muted" style="margin:0;font-size:14px">${esc(boss)} va a ver que no estás disponible y no te va a asignar nada ese día.</p>`}
        <label>Motivo (opcional)<input name="reason" maxlength="300" placeholder="Ej. viaje, otro trabajo, salud"></label>
        <div class="row"><button class="btn" type="button" data-act="block-cancel">Cancelar</button><button class="btn btn-primary" type="submit">Confirmar: no puedo</button></div>
      </form>`;
    }
    return `<div class="avail"><button class="btn" data-act="block-open" data-d="${esc(day)}">🚫 No puedo este día</button></div>`;
  }

  function noticesHtml() {
    const list = state.notices || [];
    if (!list.length) return "";
    const icon = { assigned: "✅", removed: "❌", changed: "🔄" };
    return `<section class="notices" role="status" aria-live="polite"><h2>🔔 ${list.length === 1 ? "Tenés un aviso nuevo" : `Tenés ${list.length} avisos nuevos`}</h2>
      <ul>${list.map((n) => `<li><span aria-hidden="true">${icon[n.kind] || "🔔"}</span><span>${esc(n.message)}</span><small>${esc(new Intl.DateTimeFormat("es-AR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }).format(new Date(n.created_at)))}</small></li>`).join("")}</ul>
      <button class="btn btn-primary" data-act="seen">Entendido</button></section>`;
  }

  function covHtml(c, cv) {
    return `<div class="cover"><strong>${cv.kind === "session" ? "📷 Tu sesión de fotos" : "Tu cobertura del evento"}${cv.role ? ` · ${esc(cv.role)}` : ""}</strong>
      <span>📅 ${esc(fmt(cv.date, { weekday: "long", day: "numeric", month: "long" }))}${cv.arrival ? ` · presentarte ${esc(cv.arrival)} h` : ""}${cv.end ? ` (hasta ${esc(cv.end)} h)` : ""}</span>
      ${cv.location ? `<span>📍 <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cv.location)}" target="_blank" rel="noopener">${esc(cv.location)}</a></span>` : ""}${cv.notes ? `<span>📝 ${esc(cv.notes)}</span>` : ""}</div>`;
  }

  function eventHtml(it) {
    const c = it.c;
    const tasks = state.tasks.filter((t) => t.client_id === c.id).sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0));
    const marks = new Map(state.marks.map((m) => [m.task_id, m]));
    const notes = state.notes.filter((n) => n.client_id === c.id).sort((a, b) => a.created_at.localeCompare(b.created_at));
    const open = openIds.has(it.key);
    const cv = it.covs[0];
    const addons = (Array.isArray(c.addons) ? c.addons : []).map((a) => ADDONS[a] || a);
    const pendingCount = tasks.filter((t) => !["done", "na"].includes(t.status) && !marks.has(t.id)).length;
    let lastPhase = "";
    const taskHtml = tasks.filter((t) => t.status !== "na").map((t) => {
      const mark = marks.get(t.id);
      const done = t.status === "done";
      const checked = done || Boolean(mark);
      const locked = done || (mark && !mark.mine);
      const info = done ? "Terminada" : mark ? `Marcada por ${mark.mine ? "vos" : mark.author_name} · falta que Pablo la confirme` : "";
      const ph = t.phase && t.phase !== lastPhase ? `<p class="phase">${esc(t.phase)}</p>` : "";
      lastPhase = t.phase;
      return `${ph}<label class="task ${checked ? "done" : ""}"><input type="checkbox" data-task="${esc(t.id)}" ${checked ? "checked" : ""} ${locked ? "disabled" : ""}><span>${esc(t.title)}${info ? `<small>${esc(info)}</small>` : ""}${t.notes ? `<small>${esc(t.notes)}</small>` : ""}</span></label>`;
    }).join("");
    const badge = it.session ? "📷 Sesión de fotos" : it.covs.length ? (it.covs.some((x) => x.kind === "session") && it.covs.length === 1 ? "Cubrís la sesión" : "Cubrís vos") : "";
    return `<details class="event ${it.covs.length ? "mine" : ""}" data-key="${esc(it.key)}" ${open ? "open" : ""}>
      <summary>
        <div class="date"><strong>${esc(fmt(it.date, { day: "numeric" }))}</strong><span>${esc(fmt(it.date, { weekday: "short" }))}</span></div>
        <div><p class="ev-title">${it.session ? "Sesión · " : ""}${esc(c.honoree || "Evento")}</p><p class="ev-sub">${esc([c.event_type, c.salon, c.code ? `#${c.code}` : ""].filter(Boolean).join(" · "))}${it.session ? ` · evento ${esc(fmt(c.event_date, { day: "numeric", month: "short" }))}` : ""}${cv?.arrival ? ` · llegada ${esc(cv.arrival)} h` : ""}</p></div>
        ${badge ? `<span class="badge">${esc(badge)}</span>` : pendingCount ? `<span class="badge soft">${pendingCount} pendientes</span>` : ""}
      </summary>
      <div class="body">
        ${it.covs.map((x) => covHtml(c, x)).join("")}
        <dl class="grid">
          ${c.event_time ? `<div><dt>Inicio del evento</dt><dd>${esc(c.event_time)} h</dd></div>` : ""}
          ${c.client_name ? `<div><dt>Cliente</dt><dd>${esc(c.client_name)}</dd></div>` : ""}
          ${c.client_phone ? `<div><dt>Teléfono</dt><dd>${esc(c.client_phone)}</dd></div>` : ""}
          ${c.client_email ? `<div><dt>Mail</dt><dd>${esc(c.client_email)}</dd></div>` : ""}
          ${c.pack ? `<div><dt>Pack</dt><dd>${esc(PACKS[c.pack] || c.pack)}</dd></div>` : ""}
          ${c.guests ? `<div><dt>Invitados</dt><dd>${esc(c.guests)}</dd></div>` : ""}
          ${addons.length ? `<div><dt>Adicionales</dt><dd>${esc(addons.join(", "))}</dd></div>` : ""}
        </dl>
        ${c.notes ? `<div><h3>Notas del evento</h3><div class="note">${esc(c.notes)}</div></div>` : ""}
        <div class="links">
          ${c.drive_url ? `<a class="btn btn-primary" href="${esc(c.drive_url)}" target="_blank" rel="noopener">📁 Subir fotos y videos</a>` : cv ? `<span class="muted" style="font-size:13px">📁 La carpeta de Drive todavía no está lista.</span>` : ""}
          ${c.whatsapp_group_url ? `<a class="btn" href="${esc(c.whatsapp_group_url)}" target="_blank" rel="noopener">💬 Grupo de WhatsApp</a>` : ""}
          ${waLink(c.client_phone) ? `<a class="btn" href="${esc(waLink(c.client_phone))}" target="_blank" rel="noopener">WhatsApp al cliente</a>` : ""}
        </div>
        ${tasks.length ? `<div><h3>Tareas</h3>${taskHtml}</div>` : ""}
        <div><h3>Mis notas</h3>
          ${notes.map((n) => `<div class="note">${esc(n.body)}<small><span>${esc(new Intl.DateTimeFormat("es-AR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }).format(new Date(n.created_at)))}</span><button type="button" data-unnote="${esc(n.id)}">Borrar</button></small></div>`).join("") || `<p class="muted" style="margin:0;font-size:14px">Las ven vos y Pablo.</p>`}
          <form class="note-form" data-note="${esc(c.id)}"><label class="sr"><span class="muted" style="font-size:13px">Nueva nota</span><textarea name="body" maxlength="2000" rows="2" required></textarea></label><button class="btn" type="submit">Guardar nota</button></form>
        </div>
      </div>
    </details>`;
  }

  root.addEventListener("toggle", (e) => {
    const d = e.target.closest?.("details[data-key]"); if (!d) return;
    d.open ? openIds.add(d.dataset.key) : openIds.delete(d.dataset.key);
  }, true);

  root.addEventListener("click", async (e) => {
    const t = e.target.closest("[data-tab],[data-act],[data-unnote],[data-cal],[data-day],[data-open]"); if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; renderApp(); return; }
    if (t.dataset.cal) {
      if (t.dataset.cal === "today") { calMonth = todayIso().slice(0, 7); calDay = ""; }
      else { const [y, m] = calMonth.split("-").map(Number); const d = new Date(y, m - 1 + (t.dataset.cal === "next" ? 1 : -1), 1); calMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; calDay = ""; }
      renderApp(); return;
    }
    if (t.dataset.day) { calDay = t.dataset.day; renderApp(); return; }
    if (t.dataset.open) {
      // Abre el trabajo en "Mis coberturas" (con los realizados si es del pasado).
      tab = "mine"; showPast = t.dataset.date < todayIso(); openIds.add(t.dataset.open); renderApp();
      const el = root.querySelector(`details[data-key="${CSS.escape(t.dataset.open)}"]`);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    if (t.dataset.act === "logout") { save(null); renderLogin(); return; }
    if (t.dataset.act === "reload") { refresh(); return; }
    if (t.dataset.act === "block-open") { blockForm = t.dataset.d; lastBlock = null; renderApp(); return; }
    if (t.dataset.act === "block-cancel") { blockForm = ""; renderApp(); return; }
    if (t.dataset.act === "unblock") {
      t.disabled = true;
      try { await call("unblock", { day: t.dataset.d }); state.blocked = (state.blocked || []).filter((b) => b.day !== t.dataset.d); lastBlock = null; renderApp(); toast("Día liberado"); }
      catch (err) { t.disabled = false; if (err.message !== "session") toast(err.message); }
      return;
    }
    if (t.dataset.act === "seen") {
      t.disabled = true;
      try { await call("seen"); state.notices = []; renderApp(); }
      catch (err) { t.disabled = false; if (err.message !== "session") toast(err.message); }
      return;
    }
    if (t.dataset.unnote) {
      if (!confirm("¿Borrar esta nota?")) return;
      t.disabled = true;
      try { await call("unnote", { noteId: t.dataset.unnote }); state.notes = state.notes.filter((n) => n.id !== t.dataset.unnote); renderApp(); toast("Nota borrada"); }
      catch (err) { t.disabled = false; if (err.message !== "session") toast(err.message); }
    }
  });

  root.addEventListener("change", async (e) => {
    if (e.target.matches("[data-act=past]")) { showPast = e.target.checked; renderApp(); return; }
    const box = e.target.closest("[data-task]"); if (!box) return;
    const taskId = box.dataset.task, done = box.checked;
    box.disabled = true;
    try {
      await call("mark", { taskId, done });
      if (done) state.marks.push({ task_id: taskId, author_name: state.me.name, done_at: new Date().toISOString(), mine: true });
      else state.marks = state.marks.filter((m) => m.task_id !== taskId);
      renderApp(); toast(done ? "Marcada como hecha" : "Desmarcada");
    } catch (err) { box.checked = !done; box.disabled = false; if (err.message !== "session") toast(err.message); }
  });

  root.addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector("button[type=submit]");
    if (form.id === "loginForm") {
      const f = new FormData(form);
      btn.disabled = true; btn.textContent = "Entrando…";
      try {
        const out = await call("login", { email: f.get("email"), password: f.get("password") });
        save(out.session); root.innerHTML = `<div class="wrap"><div class="empty">Cargando tus eventos…</div></div>`; refresh();
      } catch (err) { document.getElementById("loginMsg").textContent = err.message; btn.disabled = false; btn.textContent = "Entrar"; }
      return;
    }
    if (form.dataset.block) {
      const day = form.dataset.block, reason = String(new FormData(form).get("reason") || "").trim();
      btn.disabled = true;
      try {
        const out = await call("block", { day, reason });
        state.blocked = [...(state.blocked || []).filter((b) => b.day !== day), { day, reason }];
        blockForm = ""; lastBlock = { day, reason, affected: out.affected || [] };
        renderApp(); toast(lastBlock.affected.length ? "Listo: se pidió reemplazo" : "Día bloqueado");
      } catch (err) { btn.disabled = false; if (err.message !== "session") toast(err.message); }
      return;
    }
    if (form.dataset.note) {
      const body = String(new FormData(form).get("body") || "").trim(); if (!body) return;
      btn.disabled = true;
      try { const out = await call("note", { clientId: form.dataset.note, body }); state.notes.push(out.note); renderApp(); toast("Nota guardada"); }
      catch (err) { btn.disabled = false; if (err.message !== "session") toast(err.message); }
    }
  });

  // Al volver a la pestaña o al celular, trae los cambios de último momento.
  document.addEventListener("visibilitychange", () => { if (!document.hidden && state && session) refresh(); });

  session = load();
  if (session?.access_token) { root.innerHTML = `<div class="wrap"><div class="empty">Cargando tus eventos…</div></div>`; refresh(); }
  else renderLogin();
})();
</script>
</body>
</html>
